<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amigo secreto 🎁</title>
<style>
  :root { --bg:#fff7ed; --card:#ffffff; --text:#3b1d0a; --accent:#dc2626; --muted:#9a6b4f; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1410; --card:#2a1f19; --text:#fde8d7; --accent:#f87171; --muted:#c9a58c; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; display:flex; justify-content:center; padding:20px; }
  main { width:100%; max-width:480px; text-align:center; }
  h1 { margin:8px 0 4px; }
  p.sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border-radius:16px; padding:20px; box-shadow:0 4px 16px rgba(0,0,0,.12); }
  .names { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button { font:inherit; border:0; border-radius:12px; padding:14px; cursor:pointer; background:var(--accent); color:#fff; font-weight:600; }
  button.name { background:transparent; color:var(--text); border:2px solid var(--accent); }
  button.name:disabled { border-color:var(--muted); color:var(--muted); text-decoration:line-through; opacity:.6; cursor:default; }
  button.ghost { background:transparent; color:var(--muted); font-weight:400; padding:8px; margin-top:16px; }
  button:disabled { cursor:default; }
  canvas { max-width:100%; height:auto; }
  .wheel { position:relative; width:300px; max-width:100%; margin:0 auto 16px; }
  .pointer { position:absolute; top:-6px; left:50%; transform:translateX(-50%); font-size:28px; color:var(--accent); z-index:2; }
  .result { font-size:1.6rem; font-weight:700; margin:12px 0; }
  .hidden { display:none; }
  #error { color:var(--accent); margin-top:12px; }
</style>
</head>
<body>
<main>
  <h1>🎁 Amigo secreto</h1>
  <p class="sub">Nadie saca a alguien de su misma familia</p>

  <div class="card" id="pick">
    <p><strong>¿Quién eres?</strong> Toca tu nombre (solo puedes ver tu resultado una vez).</p>
    <div class="names" id="names"><p>Cargando…</p></div>
    <div id="error"></div>
    <button class="ghost" id="admin">Administrador</button>
  </div>

  <div class="card hidden" id="spin">
    <p id="hello"></p>
    <div class="wheel"><div class="pointer">▼</div><canvas id="wheel" width="300" height="300"></canvas></div>
    <button id="go">Girar la ruleta</button>
    <div id="out" class="hidden">
      <div class="result" id="result"></div>
      <p class="sub">Memorízalo. Al tocar el botón ya no podrás volver a verlo.</p>
      <button id="hide">Listo, ocultar</button>
    </div>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, runTransaction, deleteDoc }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC66bQ6XksGqeUOXHevahRi4gaxcwfCe1Q",
  authDomain: "sorteo-89496.firebaseapp.com",
  projectId: "sorteo-89496",
  storageBucket: "sorteo-89496.firebasestorage.app",
  messagingSenderId: "144426706766",
  appId: "1:144426706766:web:0faf2aa05db71e53e0e01f"
};
const db = getFirestore(initializeApp(firebaseConfig));
const col = collection(db, "sorteo");

// ---- CONFIGURACIÓN ----
// Cambia la semilla para obtener otro sorteo (y no se la digas a nadie).
const SEMILLA = "cena-24-dic-mena";
// PIN del botón "Administrador" (cámbialo).
const PIN_ADMIN = "0KrNUpXZ**";

const familias = {
  Mena:  ["Marielos", "Priscila", "Joel", "Omar", "Marta"],
  Sofia: ["Kevin", "Sofia", "Eli"],
  Doris: ["Doris", "Pati", "Lupita"],
};
const familiaDe = {};
for (const [f, ms] of Object.entries(familias)) ms.forEach(p => familiaDe[p] = f);
const personas = Object.keys(familiaDe);

// ---- SORTEO FIJO (mismo resultado en todos los dispositivos) ----
function crearAleatorio(texto) {
  let h = 1779033703 ^ texto.length;
  for (let i = 0; i < texto.length; i++) {
    h = Math.imul(h ^ texto.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19);
  }
  let a = h >>> 0;
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function sortear() {
  const azar = crearAleatorio(SEMILLA);
  while (true) {
    const rec = [...personas];
    for (let i = rec.length - 1; i > 0; i--) {
      const j = Math.floor(azar() * (i + 1));
      [rec[i], rec[j]] = [rec[j], rec[i]];
    }
    if (personas.every((d, i) => familiaDe[d] !== familiaDe[rec[i]])) {
      const r = {}; personas.forEach((d, i) => r[d] = rec[i]); return r;
    }
  }
}
const asignacion = sortear();

// ---- INTERFAZ ----
const $ = id => document.getElementById(id);
const colores = ["#ef4444","#f59e0b","#10b981","#3b82f6","#8b5cf6","#ec4899","#14b8a6","#f97316"];
let actual = null, rot = 0, tomados = [];

async function jugados() {
  const s = await getDocs(col);
  return s.docs.map(d => d.id);
}

async function mostrarNombres() {
  $("pick").classList.remove("hidden"); $("spin").classList.add("hidden");
  $("error").textContent = "";
  try {
    const ya = await jugados();
    $("names").innerHTML = "";
    personas.forEach(p => {
      const b = document.createElement("button");
      b.className = "name"; b.textContent = p;
      if (ya.includes(p)) b.disabled = true; else b.onclick = () => elegir(p);
      $("names").appendChild(b);
    });
    if (ya.length === personas.length) $("error").textContent = "🎉 Todos ya vieron su amigo secreto.";
  } catch (e) {
    $("names").innerHTML = "";
    $("error").textContent = "No se pudo conectar con la base de datos. Revisa tu internet o las reglas de Firestore.";
    console.error(e);
  }
}

function candidatos() {
  return personas.filter(p => familiaDe[p] !== familiaDe[actual] && !tomados.includes(p));
}

function dibujar() {
  const ctx = $("wheel").getContext("2d"), cands = candidatos(), sl = 2 * Math.PI / cands.length;
  ctx.clearRect(0, 0, 300, 300);
  cands.forEach((nombre, i) => {
    const a = rot + i * sl;
    ctx.beginPath(); ctx.moveTo(150, 150); ctx.arc(150, 150, 145, a, a + sl); ctx.closePath();
    ctx.fillStyle = colores[i % colores.length]; ctx.fill();
    ctx.save(); ctx.translate(150, 150); ctx.rotate(a + sl / 2);
    ctx.fillStyle = "#fff"; ctx.font = "bold 15px system-ui"; ctx.textAlign = "right";
    ctx.fillText(nombre, 135, 5); ctx.restore();
  });
}

async function elegir(p) {
  if (!confirm("¿Eres " + p + "? Solo podrás ver tu resultado una vez.")) return;
  try {
    // Marca el nombre como usado; si otro dispositivo ya lo hizo, se cancela.
    await runTransaction(db, async tx => {
      const ref = doc(db, "sorteo", p);
      if ((await tx.get(ref)).exists()) throw new Error("ya-jugo");
      tx.set(ref, { visto: true, fecha: Date.now() });
    });
  } catch (e) {
    if (e.message === "ya-jugo") alert(p + " ya vio su resultado en otro dispositivo.");
    else alert("Error de conexión. Intenta de nuevo.");
    return mostrarNombres();
  }
  const ya = await jugados();
  tomados = ya.filter(x => x !== p).map(d => asignacion[d]);
  actual = p; rot = 0;
  $("pick").classList.add("hidden"); $("spin").classList.remove("hidden");
  $("hello").textContent = "Hola " + p + ", ¡gira la ruleta!";
  $("go").disabled = false; $("go").classList.remove("hidden"); $("out").classList.add("hidden");
  dibujar();
}

$("go").onclick = () => {
  $("go").disabled = true;
  const cands = candidatos(), destino = asignacion[actual];
  const i = cands.indexOf(destino), sl = 2 * Math.PI / cands.length;
  const final = (-Math.PI / 2 - (i + 0.5) * sl) + 2 * Math.PI * 6;
  const t0 = performance.now(), dur = 4000;
  (function paso(t) {
    const k = Math.min((t - t0) / dur, 1);
    rot = final * (1 - Math.pow(1 - k, 3));
    dibujar();
    if (k < 1) requestAnimationFrame(paso);
    else {
      $("go").classList.add("hidden");
      $("result").textContent = "🎁 " + destino;
      $("out").classList.remove("hidden");
    }
  })(t0);
};

$("hide").onclick = () => { actual = null; mostrarNombres(); };

$("admin").onclick = async () => {
  if (prompt("PIN de administrador:") !== PIN_ADMIN) return;
  const nombre = prompt("Escribe el nombre a liberar (ej. Joel).\nDeja vacío para reiniciar a TODOS:");
  if (nombre === null) return;
  try {
    if (nombre.trim() === "") {
      if (!confirm("¿Reiniciar a todos? Todos podrán volver a ver su resultado.")) return;
      for (const id of await jugados()) await deleteDoc(doc(db, "sorteo", id));
    } else {
      await deleteDoc(doc(db, "sorteo", personas.find(p => p.toLowerCase() === nombre.trim().toLowerCase()) || nombre.trim()));
    }
  } catch (e) { alert("No se pudo completar la acción."); }
  mostrarNombres();
};

mostrarNombres();
</script>
</body>
</html>
